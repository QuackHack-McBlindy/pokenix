# project.toml — configuration for hooks/build-docs.py
[options]
include = ["pokenix"]
exclude_prefixes = [
  "pokenix.breedables",
  "pokenix.shiny",
  "pokenix.html",
  "pokenix.debug",
]
keep_attrs = [
  "pokenix.breedables.ducklett",
  "pokenix.shiny.ducklett",
]


[project]
name        = "pokenix"
url         = "https://QuackHack-McBlindy.com"
url_label   = "QuackHack-McBlindy.com"
version     = "1.0.1"
description = '''
<p>
  Welcome to the <strong>{name}</strong> options page.<br>
  The options on this website are automatically generated on every release.<br>
</p>
<p>
  Use the <strong>search box</strong> on the left to filter options,<br>
  or click any group to expand it and browse the tree.<br>
</p>
'''

quick_start_config = '''
# ★ ─────────────────────────────────────────────────────────────────────── ★
# THIS IS THE ONLY FILE USERS EDIT!
# FIRST TIME HERE? - SCROLL DOWN & FOLLOW THE INSTRUCTIONS

# CTRL + F `specials = {`   TO GET TO SPECIAL POKEMON
# CTRL + F `events = {`     TO GET TO EVENT POKEMON
# CTRL + F `shiny = {`      TO GET TO SHINY LIVING DEX
# CTRL + F `breedables = {` TO GET TO APRIBALLS BREEDABLES
# ★ ─────────────────────────────────────────────────────────────────────── ★
{
  lib,
  ...
} : let 
# ★ ─────────────────────────────────────────────────────────────────────── ★
# DO NOT EDIT THIS SECTION!
  balls   = [ 
    "safari" "sport" "fast" "friend" "heavy"
    "level" "love" "lure" "moon" "dream" "beast"
  ];

  mkBalls = flags: lib.genAttrs balls (_: flags);
  none    = { ball = false; ha = false; eggMoves = false; };  # not caught
  ball    = { ball = true;  ha = false; eggMoves = false; };  # caught, no extras
  HA      = { ball = true;  ha = true;  eggMoves = false; };  # caught + HA
  HAEM    = { ball = true;  ha = true;  eggMoves = true;  };  # caught + HA + EM
  allNone = mkBalls none;
  allBall = mkBalls ball;
  allHA   = mkBalls HA;
  allDone = mkBalls HAEM;
in {
# ★ ─────────────────────────────────────────────────────────────────────── ★
#  POKÉNIX CONFIG — PLEASE READ BEFORE EDITING
# ★ ─────────────────────────────────────────────────────────────────────── ★
#  ▸ ANYTHING AFTER A `#` ON A LINE IS A COMMENT. THE SITE IGNORES IT.
#      COMMENTS ARE USED BOTH FOR INSTRUCTIONS AND TO HIDE ENTRIES YOU HAVEN'T FILLED IN YET.
#  ▸ EVERY ENTRY ENDS WITH `;`  — IF YOU REMOVE THE `;`, THE SITE BREAKS.
#  ▸ CURLY BRACES `{ }` GROUP THINGS TOGETHER. 
#      FOR EVERY `{` THERE MUST BE A MATCHING `}`.
#  ▸ TEXT VALUES GO IN "double quotes".  NUMBERS AND true/false DO NOT.
#  ▸ USE CTRL + F (Cmd + F ON MAC) TO SEARCH FOR A POKÉMON BEFORE ADDING IT,
#      SO YOU DON'T CREATE A DUPLICATE ENTRY (DUPLICATES BREAK THE SITE).
# ★ ─────────────────────────────────────────────────────────────────────── ★
# ★ USER START EDIT FROM HERE!
# ★ ─────────────────────────────────────────────────────────────────────── ★
  pokenix = {

    # ★ ─────────────────────────────────────────────────────────────────────── ★
    # TRAINER CARD - WHO ARE YOU? - TEXT MUST STAY INSIDE THE QUOTES. ALL FIELDS ARE OPTINAL
    # ★ ─────────────────────────────────────────────────────────────────────── ★
    trainer = {
      name       = "PokèNix"; # <-- CHANGE ME!
      picture    = ./profile-profile.png;
      about      = "★ breeding master ★ shiny hunter ★ ducklett lover ★";
      region     = "Sweden";
      timezone   = "Europe/Stockholm";
      contact    = "Discord pungkula#0001";
      friendCode = "SW-1234-5678-9012";
      switchName = "pungkula";
      trainerId  = "082409";
    };


    # ★ ─────────────────────────────────────────────────────────────────────── ★
    # SPECIAL POKÉMON - ADD ANY POKÉMON YOUR PROUD OF
    # ★ ─────────────────────────────────────────────────────────────────────── ★
    #  TO ADD A POKÉMON: COPY THE WHOLE "mewtwo-ribbon-master" BLOCK
    #  FROM THE OPENING `{` TO THE CLOSING `};`. AND EDIT THE FIELDS.
    #
    #  THE QUOTED NAME AT THE START IS A UNIQUE ID — USE LOWERCASE AND
    #  DASHES.  IT DOESN'T HAVE TO MATCH THE SPECIES.
    #
    #  FIELD GUIDE: (SKIP ANY FIELD YOU DON'T CARE ABOUT — NONE ARE REQUIRED.)
    #    species      = LOWERCASE SPECIES NAME
    #                 EXAMPLE: "charizard-gmax", "meowth-galar"
    #    ball         = WHICH BALL IT'S CAUGHT IN (FREE TEXT)
    #                 EXAMPLE: "master", "luxury", "pokeball", "beast"
    #    shiny        = true / false
    #    selfObtained = true IF YOU CAUGHT IT, false IF TRADED
    #    level        = 1–100
    #    nature       = EXAMPLE: "Timid", "Jolly", "Modest"
    #    ability      = EXAMPLE: "Pressure", "Intimidate"
    #    heldItem     = EXAMPLE: "Life Orb", "Leftovers"
    #    teraType     = EXAMPLE: "Psychic", "Water" (GEN 9 ONLY)
    #    evs / ivs    = STAT NUMBERS (EACH FIELD ENDS WITH `;`)
    #    moves        = LIST (START WITH `[` END WITH `];`) OF MOVE NAMES IN "quotes", SEPERATED BY SPACES
    #    ribbons      = LIST (START WITH `[` END WITH `];`) OF RIBBON NAMES IN "quotes"
    #    marks        = LIST (START WITH `[` END WITH `];`) OF MARK NAMES IN "quotes" (GEN 8+)
    #    ot           = ORIGINAL TRAINER NAME (IN QUOTES)
    #    id           = original trainer ID (IN QUOTES)
    #    region       = LANGUAGE TAG, EXAMPLE: "ENG", "JPN", "GER", "FRE"
    #    obtained     = DATE, FORMAT: "YYYY/MM/DD"
    #    notes        = FREE TEXT (STORY, HUNT TIME, AND SO ON)
    #    name         = NAME OF YOUR POKÉMON. 
