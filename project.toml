# project.toml — configuration for hooks/build-docs.py
[options]
include = ["pokenix"]
exclude_prefixes = [
  "pokenix.breedables",
  "pokenix.shiny",
  "pokenix.html",
  "pokenix.debug",
]
keep_attrs = [
  "pokenix.breedables.ducklett",
  "pokenix.shiny.ducklett",
]


[project]
name        = "pokenix"
url         = "https://QuackHack-McBlindy.com"
url_label   = "QuackHack-McBlindy.com"
version     = "1.0.0"
description = '''
<p>
  Welcome to the <strong>{name}</strong> options page.<br>
  The options on this website are automatically generated on every release.<br>
</p>
<p>
  Use the <strong>search box</strong> on the left to filter options,<br>
  or click any group to expand it and browse the tree.<br>
</p>
'''

quick_start_config = '''
  pokenix = {
    breedables = {

    };
  };
'''

# overrides
# github    = "https://github.com/quackhack-mcblindy/pokenix"
# changelog = "https://github.com/quackhack-mcblindy/pokenix/blob/main/CHANGELOG.md"

[paths]
sources = ["hooks/options.json"]
dst = "docs/index.html"
logo = "images/logo.png"
screenshot_dirs = ["Screenshots", "screenshots"]
screenshot_exts = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".avif"]
